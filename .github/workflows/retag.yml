# One-off: after the history was rewritten to remove personal data (2026-11-03), the Android
# release tags still pointed at the old commits. Started by hand (Actions → "Move release tags"
# → Run workflow). The workflow token may neither move a tag in place nor create one on an old
# commit, so the old tags were removed and the newest release is published again on main (the
# app is unchanged since). Older releases stay as drafts with their APKs. Safe to run again.
# Delete this file afterwards.
name: Move release tags

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Point the tags at the new commits
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          # The old tags are gone (run 3), which turned every release into a draft. Publish the
          # newest one again on main; publishing creates its tag there. Older ones stay drafts.
          main=$(gh api "repos/$REPO/commits/main" --jq .sha)
          gh api -X PATCH "repos/$REPO/releases/433216611" -f tag_name=android-v1.0.33 -f target_commitish="$main" \
            -F draft=false -f make_latest=true --jq '.tag_name + " published, draft=" + (.draft|tostring) + ": " + .html_url'
          got=$(gh api "repos/$REPO/git/ref/tags/android-v1.0.33" --jq .object.sha)
          echo "android-v1.0.33 -> $got (main is $main)"
          [ "$got" = "$main" ]
