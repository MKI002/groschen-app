# One-off: after the history was rewritten to remove personal data (2026-11-03), the Android
# release tags still pointed at the old commits. Started by hand (Actions → "Move release tags"
# → Run workflow). The workflow token may neither move a tag in place nor create one on an old
# commit, so it removes the old tags and puts the newest release's tag back on main (the app is
# unchanged since). Older releases keep their APKs but have no tag any more. Safe to run again.
# Delete this file afterwards.
name: Move release tags

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Point the tags at the new commits
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          latest=android-v1.0.33
          main=$(gh api "repos/$REPO/commits/main" --jq .sha)
          release_id() { gh api "repos/$REPO/releases?per_page=100" --jq ".[] | select(.tag_name == \"$1\") | .id"; }
          # First a harmless try on the oldest release (its tag is already gone): if a release may not
          # put its tag on main either, stop here before any other tag is touched.
          probe=android-v1.0.6
          if ! gh api "repos/$REPO/git/ref/tags/$probe" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$REPO/releases/$(release_id $probe)" -f tag_name="$probe" -f target_commitish="$main" --jq '"probe ok: " + .tag_name'
            gh api -X DELETE "repos/$REPO/git/refs/tags/$probe" && echo "$probe: probe tag removed again"
          fi
          for tag in android-v1.0.6 android-v1.0.7 android-v1.0.10 android-v1.0.18 android-v1.0.22 \
                     android-v1.0.25 android-v1.0.28 android-v1.0.31 android-v1.0.33; do
            if gh api "repos/$REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
              gh api -X DELETE "repos/$REPO/git/refs/tags/$tag" && echo "$tag: old tag removed"
            else
              echo "$tag: no tag"
            fi
          done
          # The newest release gets its tag back, on main.
          gh api -X PATCH "repos/$REPO/releases/$(release_id $latest)" -f tag_name="$latest" -f target_commitish="$main" \
            -F draft=false -f make_latest=true --jq '.tag_name + " published: " + .html_url'
          got=$(gh api "repos/$REPO/git/ref/tags/$latest" --jq .object.sha)
          echo "$latest -> $got (main is $main)"
          [ "$got" = "$main" ]
