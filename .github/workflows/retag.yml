# One-off: after the history was rewritten to remove personal data (2026-11-03), the Android
# release tags still pointed at the old commits. Started by hand (Actions → "Move release tags"
# → Run workflow), it moves each tag to the same commit in the new history, so the releases and
# their APKs stay as they are. Safe to run again. Delete this file afterwards.
name: Move release tags

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Point the tags at the new commits
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Oldest first, so a surprise stops at the least important release.
          # Moving a tag in place is refused for this token, so each tag is removed and its release
          # puts it back on the new commit (a release creates its missing tag at target_commitish).
          failed=0
          while read -r tag sha; do
            [ -n "$tag" ] || continue
            now=$(gh api "repos/$REPO/git/ref/tags/$tag" --jq .object.sha 2>/dev/null || true)
            if [ "$now" = "$sha" ]; then echo "$tag already at $sha"; continue; fi
            id=$(gh api "repos/$REPO/releases/tags/$tag" --jq .id)
            gh api -X DELETE "repos/$REPO/git/refs/tags/$tag"
            gh api -X PATCH "repos/$REPO/releases/$id" -f tag_name="$tag" -f target_commitish="$sha" -F draft=false --jq '.tag_name + " released"'
            got=$(gh api "repos/$REPO/git/ref/tags/$tag" --jq .object.sha 2>/dev/null || true)
            if [ "$got" = "$sha" ]; then echo "$tag -> $sha"; else echo "::error::$tag is at '$got', expected $sha"; failed=1; fi
          done <<'TAGS'
          android-v1.0.6 28a33c4e0fd440ae2c42bed6523affd35c50129d
          android-v1.0.7 eac94cbafc7389a84f470753224dbe2988b2e34e
          android-v1.0.10 7f575d4dc07899e881f76a1cfbd988655e1d6ff9
          android-v1.0.18 255525cc4a9734304c87ec5856ac3a1dc0b3b590
          android-v1.0.22 fe7fb89d5b0caa1173f3d3bbd51bb977fb0399e0
          android-v1.0.25 2044b26e696b3e7b36a0a9e6da45ff4704f54935
          android-v1.0.28 7807b25065d264455b21aff3e4bcced35e267cea
          android-v1.0.31 53d1dceae0485f6ea28e44ec31585d544aec0de4
          android-v1.0.33 f9881f008d0f215e0a38b45cd00ae69d3d535d14
          TAGS
          exit $failed
