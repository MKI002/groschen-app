# Tests every change. On main of the original repository it also publishes the image to
# GitHub's registry; forks and copies only build and test.
# Actions are pinned to commit hashes; the tag they stand for is in the comment.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Install backend packages
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r backend/requirements.txt
          python -m pip install -r backend/requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .

      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.3"

      - name: Type-check and build the web app
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

  image:
    name: Image
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'MKI002/groschen' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: groschen:test
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Always rebuild the final stage so it gets the latest Debian security fixes.
          no-cache-filters: runtime

      # Loads the bundled model, categorizes sample texts and checks that the network
      # guard blocks the internet. A failure stops the image from being published.
      - name: Self-test inside the image
        run: docker run --rm groschen:test python -m groschen.selftest

      # Known vulnerabilities in the finished image (Debian packages and Python packages).
      # A fixable high or critical one stops the image from being published.
      - name: Vulnerability scan of the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: groschen:test
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

      - name: Log in to GitHub's registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # "latest" is what Unraid pulls. Every build also gets its own date-and-commit tag,
      # so an older version can be picked in Unraid to roll back.
      - name: Publish
        if: env.PUBLISH == 'true'
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/groschen"
          version="$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          docker tag groschen:test "$image:$version"
          docker tag groschen:test "$image:latest"
          docker push "$image:$version"
          docker push "$image:latest"
          echo "Published $image:$version" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the newest 20 versions
        if: env.PUBLISH == 'true'
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: groschen
          package-type: container
          min-versions-to-keep: 20
