# The Android app: built and tested on every pull request that touches it, checked for known
# vulnerabilities in its libraries, and on main published as a signed APK under Releases.
#
# Signing needs two repository secrets (see android/README.md):
#   ANDROID_KEYSTORE           the key file, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  its password
# Without them everything still builds and is tested; only the release is skipped, with a note.
name: Android app

on:
  pull_request:
    paths:
      - "android/**"
      - "backend/groschen/api/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "!android/scripts/**" # a change to the emulator test alone doesn't need a new APK
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build, test and scan the app
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      # Also checks that the Gradle wrapper in the repository is the real one.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Build the app
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      # The exact libraries that end up inside the app, for the vulnerability scan.
      - name: List the app's libraries
        run: |
          ./gradlew --no-daemon :app:dependencies --configuration releaseRuntimeClasspath --write-locks
          mkdir -p "$RUNNER_TEMP/libraries"
          cp app/gradle.lockfile "$RUNNER_TEMP/libraries/"
          echo "$(grep -c = app/gradle.lockfile) libraries listed"

      # A fixable high or critical vulnerability in one of them stops the release.
      - name: Vulnerability scan of the app's libraries
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ runner.temp }}/libraries
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

      # The release build as people install it runs on an emulator: it connects to a Groschen
      # server with invented demo data, logs in and opens every page. A crash stops the release.
      - name: Sign the app with a throwaway key for the emulator
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/test.p12" -storetype PKCS12 -storepass throwaway \
            -alias test -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Groschen test" 2> /dev/null
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/test.p12" --ks-pass pass:throwaway \
            --out "$RUNNER_TEMP/groschen-test.apk" app/build/outputs/apk/release/app-release-unsigned.apk

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.14"

      - name: Start a Groschen server with demo data
        working-directory: backend
        env:
          GROSCHEN_DATA: ${{ runner.temp }}/demo
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r requirements.txt
          python -m groschen.demo
          nohup python -m groschen > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 60); do curl -sf http://localhost:8420/api/health > /dev/null && break; sleep 1; done
          curl -sf -H "Content-Type: application/json" -H "X-Groschen: 1" \
            -d '{"username":"alex","name":"Alex","password":"demo-password-123"}' \
            http://localhost:8420/api/setup/account > /dev/null

      - name: Let the emulator use the processor's virtualisation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Log in and open every page on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          enable-hw-keyboard: true
          working-directory: android
          script: python3 scripts/smoke_test.py "$RUNNER_TEMP/groschen-test.apk" "$RUNNER_TEMP/screenshots"

      - name: What the demo server logged
        if: failure()
        run: tail -n 80 "$RUNNER_TEMP/server.log" || true

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish the APK
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Is the signing key there?
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### No APK published yet"
              echo "The app was built and tested, but the signing key is missing."
              echo "Add the repository secrets ANDROID_KEYSTORE and ANDROID_KEYSTORE_PASSWORD"
              echo "(the steps are in android/README.md), then run this workflow again."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.key.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: steps.key.outputs.ready == 'true'

      # The key exists only for this step, in the runner's temporary folder.
      - name: Build the signed APK
        if: steps.key.outputs.ready == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          GROSCHEN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GROSCHEN_BUILD_NUMBER: ${{ github.run_number }}
          GROSCHEN_VERSION_NAME: ${{ env.VERSION }}
        run: |
          export GROSCHEN_KEYSTORE="$RUNNER_TEMP/groschen.p12"
          trap 'rm -f "$GROSCHEN_KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE" | base64 --decode --ignore-garbage > "$GROSCHEN_KEYSTORE"
          ./gradlew --no-daemon --stacktrace assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/groschen-$VERSION.apk"

      - name: Publish the release
        if: steps.key.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="$RUNNER_TEMP/groschen-$VERSION.apk"
          sum=$(sha256sum "$apk" | cut -d' ' -f1)
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          The native Android app for your own Groschen server (Android 11 or newer).

          **Install:** open this page on your phone, tap \`groschen-$VERSION.apk\` below and allow the
          install. **Update:** the app finds new versions here by itself and installs them after a
          tap (Settings → Updates in the app). Or install a newer APK over the old one.

          SHA-256 of the APK: \`$sum\`
          EOF
          gh release create "android-v$VERSION" "$apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Groschen for Android $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
